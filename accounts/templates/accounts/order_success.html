<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | MediMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-lg w-full rounded-3xl p-8 shadow-2xl border border-slate-100 text-center">
    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h1 class="text-3xl font-black text-slate-900 mb-2">Order Confirmed!</h1>
    <p class="text-slate-500 mb-6 text-sm">Thank you, <strong>{{ customer.name }}</strong>. Your prescription order has been synced with our POS database.</p>

    <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-200 text-left space-y-3">
      <div class="flex justify-between text-sm">
        <span class="text-slate-500">Order ID:</span>
        <span class="font-bold text-slate-900">#ORD-{{ order.id }}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-slate-500">Customer Email:</span>
        <span class="font-bold text-slate-900">{{ customer.email }}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-slate-500">Total Amount:</span>
        <span class="font-extrabold text-sky-600">Rs. {{ order.total_amount }}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-slate-500">Order Status:</span>
        <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">{{ order.order_status }}</span>
      </div>
    </div>

    <a href="{% url 'home' %}" class="inline-block bg-sky-600 hover:bg-sky-700 text-white font-bold px-8 py-3.5 rounded-full shadow-lg shadow-sky-500/30 transition-transform active:scale-95 text-sm">
      Back to Pharmacy Store
    </a>
  </div>

</body>
</html>
