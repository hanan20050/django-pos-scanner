{% extends 'accounts/main.html' %}


{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4">
    <div class="max-w-4xl mx-auto">

        <div class="mb-8">
            <a href="{% url 'employee_list' %}" class="text-blue-600 font-bold hover:underline">← Back to Directory</a>
            <h1 class="text-3xl font-black text-gray-900 mt-2">Add New Employee</h1>
            <p class="text-gray-500">Fill in the details to create a new staff profile.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
            <form method="POST" enctype="multipart/form-data" class="p-8 sm:p-12">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    {{ form }}
                </div>

                <div class="mt-10 pt-6 border-t border-gray-100 flex justify-end gap-4">
                    <a href="{% url 'employee_list' %}" class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition">Cancel</a>
                    <button type="submit" class="px-10 py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg hover:bg-blue-700 transform active:scale-95 transition">
                        SAVE EMPLOYEE
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
