<div id="installment-modal" class="hidden relative w-full max-w-5xl bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col md:flex-row animate-in zoom-in duration-300">

    <button onclick="closeCheckoutModal()" class="absolute top-6 right-6 z-20 p-2 rounded-full bg-white/80 text-gray-400 hover:text-gray-900 shadow-sm transition-all">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>

    <div class="w-full md:w-[60%] p-4 border-r border-gray-100">
        <div class="flex items-center gap-4 mb-8">
            <div class="h-14 w-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-200">
                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            </div>
            <div>
                <h3 class="text-3xl font-black text-gray-900 tracking-tight">Credit Application</h3>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">New Customer Registration</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2 bg-gray-50 rounded-2xl p-4 border border-transparent focus-within:border-blue-600 transition-all">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Full Name</label>
                <input type="text" id="ins-cust-name" class="w-full rounded bg-transparent font-bold text-gray-900 outline-none" placeholder="Juan Dela Cruz">
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 border border-transparent focus-within:border-blue-600 transition-all">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Email Address</label>
                <input type="email" id="ins-cust-email" class="w-full rounded bg-transparent font-bold text-gray-900 outline-none" placeholder="juan@email.com">
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 border border-transparent focus-within:border-blue-600 transition-all">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Phone Number</label>
                <input type="text" id="ins-cust-phone" class="w-full rounded bg-transparent font-bold text-gray-900 outline-none" placeholder="09XX XXX XXXX">
            </div>

            <div class="col-span-2 bg-gray-50 rounded-2xl p-4 border border-transparent focus-within:border-blue-600 transition-all">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Complete Address</label>
                <input type="text" id="ins-cust-address" class="w-full rounded bg-transparent font-bold text-gray-900 outline-none" placeholder="Brgy, City, Province">
            </div>
        </div>

        <div class="mt-8 grid grid-cols-2 gap-4 p-6 bg-slate-900 rounded-[32px] text-white">
            <div class="border-r border-slate-700 pr-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Select Term</label>
                <select id="inst-term" onchange="updateInstallmentCalculation()" class="w-full rounded bg-transparent font-black text-2xl text-blue-400 outline-none cursor-pointer pl-2">
                    <option value="3" class="text-gray-900">3 Months</option>
                    <option value="6" class="text-gray-900">6 Months</option>
                    <option value="12" class="text-gray-900">12 Months</option>
                </select>
            </div>

            <div class="pl-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Downpayment (Cash)</label>
                <div class="flex items-center">
                    <span class="text-xl font-black text-slate-500 mr-1">₱</span>
                    <input type="number" id="inst-downpayment" oninput="updateInstallmentCalculation()"
                           class="w-full rounded bg-transparent font-black text-2xl text-white outline-none"
                           placeholder="0.00">
                </div>
            </div>

            <div class="col-span-2 mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Balance to Finance</label>
                    <p id="inst-balance-display" class="text-lg font-bold text-slate-300">₱0.00</p>
                </div>
                <div class="text-right">
                    <label class="block text-[10px] font-black text-blue-400 uppercase mb-1">Monthly Payment</label>
                    <p id="inst-monthly-display" class="text-4xl font-black text-white">₱0.00</p>
                </div>
            </div>
        </div>

    </div>

    <div class="w-full md:w-[40%] bg-gray-50/50 p-4 flex flex-col pt-8">
        <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-6">Order Summary</h4>

        <div id="installment-cart-items" class="flex-grow space-y-4 overflow-y-auto max-h-[400px] pr-2 custom-scrollbar">
            </div>

        <div class="mt-8 pt-6 border-t border-gray-200">
            <div class="flex justify-between items-end mb-6">
                <span class="text-xs font-black text-gray-400 uppercase">Total Loan Amount</span>
                <span id="installment-total-display" class="text-3xl font-black text-gray-900">₱0.00</span>
            </div>
            <button id="submit-installment" class="w-full bg-blue-600 hover:bg-blue-700 hover:shadow-xl hover:shadow-blue-200 text-white font-black py-5 rounded-2xl transition-all uppercase tracking-widest text-sm active:scale-95">
                Submit to Credit Officer
            </button>
        </div>
    </div>

</div>
